org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
# 用系统的 JDK 21 启动 Gradle（系统没装 JDK 17，Gradle 9.1 toolchain 自动下载仓库未配置）
org.gradle.java.home=C:\\Program Files\\Microsoft\\jdk-21.0.11.10-hotspot
android.useAndroidX=true
android.enableJetifier=true
# 强制 NDK / Build Tools 版本，防止 AGP 9.0+ 取插件约束的交集导致降级
android.ndkVersion=29.0.13846066
android.buildToolsVersion=36.0.0
# 回退旧 DSL：KGP 2.3.20 跟 AGP 9.0 newDSL 不兼容，Built-in Kotlin 迁移还没做完
android.newDsl=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false

org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m

android.useAndroidX=true
android.enableJetifier=true
# 强制 NDK / Build Tools 版本，防止 AGP 9.0+ 取插件约束的交集导致降级
android.ndkVersion=29.0.13846066
android.buildToolsVersion=36.0.0
# 回退旧 DSL：KGP 2.3.20 跟 AGP 9.0 newDSL 不兼容，Built-in Kotlin 迁移还没做完
android.newDsl=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
